<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surface — Surface Explorer</title>
  <link rel="stylesheet" href="assets-b846816/style.css">
</head>
<body>
  <div class="app no-sidebar">
    <main id="main">
      <div class="page">
        <div class="crumbs"><a id="sf-crumb-seed" href="index.html">🌍 Seed</a> <span>→</span> <span id="sf-crumb-name"></span></div>
        <h2>🗺️ <span id="sf-name"></span> <span id="sf-badge" class="badge zone-type">…</span> <span class="badge zone-type" title="generated entirely in your browser — no backend">client-side</span></h2>
        <div id="sf-meta" class="hint"></div>
        <div class="filter-bar">
          <label>Preview radius <input type="number" id="sf-radius" min="10" max="10000" step="50" value="2000" style="width:7em"></label>
          <label id="sf-layer-wrap">Layer <select id="sf-layer">
            <option value="0">Terrain + ore</option>
            <option value="1">Terrain only</option>
            <option value="2">Ore only</option>
          </select></label>
          <label id="sf-dim-wrap" hidden title="terrain brightness under the resources">Terrain <input type="range" id="sf-dim" min="0" max="100" value="100" style="width:8em;vertical-align:middle"></label>
          <button type="button" class="btn" id="sf-go">Generate</button>
          <span id="sf-status" class="hint"></span>
        </div>
        <div class="progress-wrap" id="sf-progress-wrap"><div id="sf-progress" class="progress-fill"></div></div>
        <div class="surf-box">
          <canvas id="sf-canvas" width="600" height="600"></canvas>
          <div id="sf-res" class="hint"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="assets-b846816/shell.js"></script>
  <script src="assets-b846816/gen-bridge.js"></script>
  <script src="assets-b846816/universe-wasm.js"></script>
  <script src="assets-b846816/surface-wasm.js"></script>
  <script src="assets-b846816/sa-wasm.js"></script>
  <script src="assets-b846816/gpu-surface.js"></script>
  <script src="assets-b846816/surface.js"></script>
</body>
</html>
