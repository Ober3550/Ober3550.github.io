<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surface — Surface Explorer</title>
  <link rel="stylesheet" href="assets-bc57a28/style.css">
</head>
<body>
  <div class="app no-sidebar">
    <main id="main">
      <div class="page">
        <h2 class="seed-link"><a id="sf-crumb-seed" href="index.html" title="Back to this seed's zones">Seed</a></h2>
        <div class="zone-card"><strong id="sf-name"></strong> <span id="sf-badge" class="badge zone-type">…</span><span id="sf-meta"></span>
          <div id="sf-radius-row" class="radius-row" hidden><label>Radius: <input type="number" id="sf-radius" min="16" max="10000" step="1"></label>
            <button type="button" class="btn-sm" id="sf-go" hidden>Generate</button></div>
          <label id="sf-dim-wrap" class="dim-row" hidden title="How bright the terrain is drawn under the resources">Terrain Brightness: <span id="sf-dim-val">100%</span>
            <input type="range" id="sf-dim" min="0" max="100" value="100"></label>
          <div id="sf-enemy-wrap" class="check-row" hidden>
            <label id="sf-areas"><input type="checkbox" id="sf-enemy" checked> Enemy bases</label>
            <span id="sf-groups" hidden>
              <label><input type="checkbox" data-group="enemies" checked> Enemies</label>
              <label><input type="checkbox" data-group="trees" checked> Trees</label>
              <label><input type="checkbox" data-group="rocks" checked> Rocks</label>
              <label><input type="checkbox" data-group="huge" checked> Huge rocks</label>
              <label><input type="checkbox" data-group="cliffs" checked> Cliffs</label>
            </span>
            <label id="sf-seams" hidden><input type="checkbox" id="sf-seams-cb" checked> Core seams <span id="sf-seams-n" class="num"></span></label>
          </div>
          <div class="download-row"><button type="button" class="btn-sm" id="sf-download" hidden title="Save the map as it is shown - terrain at this brightness, with the layers that are ticked - as one PNG">Download PNG</button></div>
        </div>
        <div id="sf-status" class="hint surf-status"></div>
        <div class="progress-wrap" id="sf-progress-wrap"><div id="sf-progress" class="progress-fill"></div></div>
        <div class="surf-box">
          <canvas id="sf-canvas" width="600" height="600"></canvas>
          <div id="sf-res" class="hint"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="assets-bc57a28/shell.js"></script>
  <script src="assets-bc57a28/gen-bridge.js"></script>
  <script src="assets-bc57a28/universe-wasm.js"></script>
  <script src="assets-bc57a28/surface-wasm.js"></script>
  <script src="assets-bc57a28/sa-wasm.js"></script>
  <script src="assets-bc57a28/gpu-surface.js"></script>
  <script src="assets-bc57a28/surface.js"></script>
</body>
</html>
