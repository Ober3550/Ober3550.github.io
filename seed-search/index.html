<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factorio Seed Viewer</title>
  <link rel="stylesheet" href="assets-c3f4807/style.css">
</head>
<body>
  <div class="app no-sidebar">
    <main id="main">
      <div class="page">
        <h2 class="page-title"><img src="assets-c3f4807/factorio-gear.webp" alt="" width="32" height="32"> Factorio Seed Viewer</h2>
        <div class="filter-bar seed-controls">
          <div><label>Mod config: <select id="mod-select"></select></label></div>
          <div><label>Seed: <input type="number" id="seed-input" min="0" step="1" placeholder="e.g. 32094082" style="width:12em"></label>
            <button type="button" class="btn" id="gen-btn">Generate</button>
            <span id="gen-status" class="hint"></span></div>
          <div class="se-only"><label>Search: <input type="text" id="zt-search" placeholder="Zone / Resource" autocomplete="off"></label></div>
          <div class="se-only"><label class="hint" title="The Calidus home system plus every asteroid field (fields orbit other stars, incl. the naquium-primary one) — the default SE view"><input type="checkbox" id="cal-filter" checked> Calidus + asteroid fields</label></div>
          <div class="se-only"><label class="hint" title="Only the rows with a colour wash: Nauvis, surfaces holding a resource combination, and the nearest naquium-primary asteroid field"><input type="checkbox" id="hl-filter"> Only highlighted</label></div>
        </div>
        <details id="featured" hidden style="margin:0.5em 0 1em">
          <summary style="cursor:pointer"><strong>Top seeds</strong> <span id="featured-note" class="hint"></span></summary>
          <div style="max-height:24em;overflow:auto;margin-top:0.5em">
          <table class="data-table">
            <thead id="featured-head" style="position:sticky;top:0;background:var(--bg,#0d1117)"><tr>
              <th class="sortable" data-key="seed">Seed <span class="sort-ind"></span></th>
              <th class="sortable" data-key="score" title="Search score: planet count first, then field distance, hostility and water">Score <span class="sort-ind"></span></th>
              <th class="sortable" data-key="planets" title="Planets in the Calidus home system, including Nauvis">Planets <span class="sort-ind"></span></th>
              <th class="sortable" data-key="bodies" title="Planets and moons in the Calidus home system">Bodies <span class="sort-ind"></span></th>
              <th class="sortable" data-key="naquiumDv" title="Travel Δv to the nearest asteroid field whose primary resource is naquium">Naquium Δv <span class="sort-ind"></span></th>
              <th class="sortable" data-key="fieldDv" title="Travel Δv to the nearest asteroid field of any kind">Field Δv <span class="sort-ind"></span></th>
              <th class="sortable" data-key="combinedDv" title="Travel Δv from Nauvis to the nearest surface with vulcanite, cryonite and holmium together">Combined Δv <span class="sort-ind"></span></th>
              <th class="sortable" data-key="combinedRadius" title="Radius of that surface">Combined radius <span class="sort-ind"></span></th>
              <th class="sortable" data-key="hostile" title="Share of home-system bodies with enemies">Hostile <span class="sort-ind"></span></th>
              <th class="sortable" data-key="water" title="Share of home-system bodies with water">Water <span class="sort-ind"></span></th>
              <th class="sortable" data-key="loot" title="Loot sequence">Loot <span class="sort-ind"></span></th>
            </tr></thead>
            <tbody id="featured-body"></tbody>
          </table>
          </div>
        </details>
        <div id="planet-cards" class="planet-cards"></div>
        <table class="data-table" id="zone-table">
          <thead id="zt-head"><tr>
            <th class="sortable" data-key="name" style="cursor:pointer">Zone <span class="sort-ind"></span></th>
            <th class="sortable" data-key="type" style="cursor:pointer">Type <span class="sort-ind"></span></th>
            <th class="sortable" data-key="radius" style="cursor:pointer">Radius <span class="sort-ind"></span></th>
            <th title="Travel Δv to Nauvis (km)" class="sortable" data-key="dv" style="cursor:pointer">Δv <span class="sort-ind"></span></th>
            <th>Water</th><th>Enemy</th>
            <th class="sortable" data-key="primary" style="cursor:pointer">Primary <span class="sort-ind"></span></th>
            <th>Estimated resources</th>
          </tr></thead>
          <tbody id="zt-body"><tr><td colspan="8" class="hint">Enter a seed and press Generate.</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="assets-c3f4807/shell.js"></script>
  <script src="assets-c3f4807/gen-bridge.js"></script>
  <script src="assets-c3f4807/universe-wasm.js"></script>
  <script src="assets-c3f4807/estimate-core.js"></script>
  <script src="assets-c3f4807/analyze.js"></script>
</body>
</html>
