<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factorio Seed Viewer</title>
  <link rel="stylesheet" href="assets-40cac7a/style.css">
</head>
<body>
  <div class="app no-sidebar">
    <main id="main">
      <div class="page">
        <h2 class="page-title"><img src="assets-40cac7a/factorio-gear.webp" alt="" width="32" height="32"> Factorio Seed Viewer</h2>
        <details id="featured" hidden style="margin:0.5em 0 1em">
          <summary style="cursor:pointer"><strong>Top seeds</strong> <span id="featured-note" class="hint"></span></summary>
          <div class="filter-bar seed-controls" style="margin-top:0.5em">
            <div id="featured-prod" class="check-line"></div>
            <div><label>Planets: <select id="featured-planets"></select></label></div>
          </div>
          <div class="featured-scroll" style="margin-top:0.5em">
          <table class="data-table">
            <thead id="featured-head" style="position:sticky;top:0;background:var(--bg,#0d1117)"></thead>
            <tbody id="featured-body"></tbody>
          </table>
          </div>
        </details>
        <div class="filter-bar seed-controls">
          <div><label>Mod config: <select id="mod-select"></select></label></div>
          <div><label>Seed: <input type="text" inputmode="numeric" id="seed-input" placeholder="e.g. 32094082" autocomplete="off" style="width:12em"></label>
            <button type="button" class="btn" id="gen-btn">Generate</button>
            <span id="gen-status" class="hint"></span></div>
          <div id="seed-loot-row" hidden><label>Loot: <code id="seed-loot" style="font-size:1.05em"></code></label></div>
          <div class="se-only"><label>Search: <input type="text" id="zt-search" placeholder="Zone / Resource" autocomplete="off"></label></div>
          <div class="se-only"><label class="hint" title="The Calidus home system plus every asteroid field (fields orbit other stars, incl. the naquium-primary one) — the default SE view"><input type="checkbox" id="cal-filter" checked> Calidus + asteroid fields</label></div>
          <div class="se-only"><label class="hint" title="Highlight the surfaces to settle for a resource combination: vulcanite + cryonite + holmium, vulcanite + iridium, cryonite + holmium, vitamelange + stone (vitamelange-primary), and the nearest beryllium- and iridium-primary surfaces. Where a seed has no surface for a combination, the nearest surface for each of its resources is marked instead"><input type="checkbox" id="hl-combined" checked> Highlight combined resources</label></div>
          <div class="se-only"><label class="hint" title="Highlight every zone whose primary resource is vulcanite, cryonite, holmium, iridium, beryllium, vitamelange or naquium - where that resource's core fragments come from"><input type="checkbox" id="hl-primary"> Highlight primary core resources</label></div>
          <div class="se-only"><label class="hint" title="Zones with this enemy level or more are passed over by the highlighting: the next suitable zone is marked instead">Exclude zones with enemies: <select id="hl-enemy"></select></label></div>
          <div class="se-only"><label class="hint" title="Never highlight a zone without water - not even as the last resort for a resource no watered zone has"><input type="checkbox" id="hl-wet" checked> Exclude zones with no water</label></div>
          <div class="se-only"><label class="hint" title="Only the rows with a colour wash: Nauvis, surfaces holding a resource combination, and the nearest naquium-primary asteroid field"><input type="checkbox" id="hl-filter"> Only highlighted</label></div>
        </div>
        <div id="planet-cards" class="planet-cards"></div>
        <table class="data-table" id="zone-table">
          <thead id="zt-head"><tr>
            <th class="sortable" data-key="name" style="cursor:pointer">Zone <span class="sort-ind"></span></th>
            <th class="sortable" data-key="type" style="cursor:pointer">Type <span class="sort-ind"></span></th>
            <th class="sortable" data-key="radius" style="cursor:pointer">Radius <span class="sort-ind"></span></th>
            <th title="Travel Δv to Nauvis (km)" class="sortable" data-key="dv" style="cursor:pointer">Δv <span class="sort-ind"></span></th>
            <th>Water</th><th>Enemy</th>
            <th class="sortable" data-key="primary" style="cursor:pointer">Primary <span class="sort-ind"></span></th>
            <th>Estimated resources</th>
          </tr></thead>
          <tbody id="zt-body"><tr><td colspan="8" class="hint">Enter a seed and press Generate.</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="assets-40cac7a/shell.js"></script>
  <script src="assets-40cac7a/gen-bridge.js"></script>
  <script src="assets-40cac7a/universe-wasm.js"></script>
  <script src="assets-40cac7a/estimate-core.js"></script>
  <script src="assets-40cac7a/analyze.js"></script>
</body>
</html>
